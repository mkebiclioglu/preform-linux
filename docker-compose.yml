services:
  preform:
    # Prebuilt image (no Formlabs software inside). `docker compose up --build`
    # builds the same thing locally from docker/Dockerfile instead.
    image: ghcr.io/mkebiclioglu/preform-linux:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    platform: linux/amd64
    # PreFormServer has no authentication; keep the port on loopback.
    ports:
      - "127.0.0.1:44388:44388"
    volumes:
      - preform-data:/data   # PreFormServer install + Wine prefix (about 1.5 GB)
      - ./jobs:/jobs         # models in, .form files out; PreFormServer sees this as Z:/jobs
    environment:
      PREFORM_VERSION: ${PREFORM_VERSION:-latest}
      # uid/gid that should own files written to ./jobs (defaults: 1000/1000)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Printers by IP, probed once the server is up and every 10 minutes after
      # (LAN printers are not found by mDNS under Wine; addressing them works).
      PREFORM_PRINTERS: ${PREFORM_PRINTERS:-}   # e.g. 10.0.0.21,printer-sim
      # Formlabs account for Fleet Control / Dashboard printing. Prefer the secret
      # file below over putting the password in the environment.
      FORMLABS_USERNAME: ${FORMLABS_USERNAME:-}
      FORMLABS_PASSWORD: ${FORMLABS_PASSWORD:-}
      # FORMLABS_PASSWORD_FILE: /run/secrets/formlabs_password
    # secrets: [formlabs_password]
    restart: unless-stopped
    stop_grace_period: 20s

  # Optional fake printer: `docker compose --profile sim up` starts it and PreFormServer
  # discovers it as a Form 4 named SimForm4 (see sim/README.md). Prints go to it and
  # are logged; nothing is made. PREFORM_PRINTERS above must include "printer-sim".
  printer-sim:
    profiles: [sim]
    image: python:3.12-alpine
    command: ["python3", "/sim/printer-sim.py", "--bind", "0.0.0.0", "--serial", "SimForm4", "--machine", "FORM-4-0", "--product", "Form 4"]
    volumes:
      - ./sim:/sim:ro
    restart: unless-stopped

# secrets:
#   formlabs_password:
#     file: ./formlabs_password.txt

volumes:
  preform-data:
