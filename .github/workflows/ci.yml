name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # weekly: catches new PreFormServer and Wine releases

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck -S warning -x bin/preform-linux docker/entrypoint.sh docker/healthcheck.sh examples/smoke.sh
      - run: bash -n bin/preform-linux && bin/preform-linux help >/dev/null
      - run: python3 -m py_compile sim/printer-sim.py && python3 sim/printer-sim.py --help >/dev/null

  shim:
    name: dnsapi shim (mingw-w64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev binutils-mingw-w64-x86-64 make
      - run: make -C shim dnsapi.dll check
      - uses: actions/upload-artifact@v4
        with:
          name: dnsapi-shim
          path: shim/dnsapi.dll

  docker:
    name: Docker image (WineHQ devel, no shim)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f docker/Dockerfile -t preform-linux:ci .
      - name: Simulated printer on the host (sim/printer-sim.py, port 35)
        run: |
          sudo nohup python3 sim/printer-sim.py --bind 0.0.0.0 --serial SimForm4 >sim.log 2>&1 &
          sleep 1; sudo ss -ltnp | grep -q ':35 ' || { cat sim.log; exit 1; }
      - name: Start PreFormServer (downloads it from Formlabs on first start)
        run: |
          mkdir -p "$PWD/jobs"
          # The simulator listens on the host; from the container that is the bridge gateway.
          # PREFORM_PRINTERS takes IP addresses: names are not resolved reliably inside Wine.
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}'); echo "gateway $GW"; echo "GW=$GW" >>"$GITHUB_ENV"
          docker run -d --name preform -p 127.0.0.1:44388:44388 -v "$PWD/jobs:/jobs" \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -e WINEDEBUG=-all,err+all \
            -e PREFORM_PRINTERS="198.51.100.1,$GW" -e PREFORM_PRINTERS_TIMEOUT=10 -e PREFORM_PRINTERS_INTERVAL=0 \
            preform-linux:ci
      - name: Wait until the API answers
        run: |
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:44388/ || true)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "up after ${i}x5s (HTTP $code)"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' preform)" != "true" ]; then echo "container exited"; docker logs preform; exit 1; fi
            [ $((i % 12)) -eq 0 ] && docker logs --tail 3 preform 2>&1
            sleep 5
          done
          echo "timed out"; docker logs preform; exit 1
      - name: Smoke test through the API (prints to the simulated printer too)
        env:
          PREFORM_URL: http://127.0.0.1:44388
          SMOKE_REMOTE_DIR: Z:/jobs
          SMOKE_SIM_PRINTER: SimForm4
        run: |
          for i in $(seq 1 30); do docker logs preform 2>&1 | grep -q "printer at $GW: Form 4" && break; sleep 2; done
          SMOKE_LOCAL_DIR="$PWD/jobs" examples/smoke.sh
      - name: Configured printers were probed at start (PREFORM_PRINTERS)
        run: |
          for i in $(seq 1 30); do docker logs preform 2>&1 | grep -q "printer at $GW" && break; sleep 2; done
          docker logs preform 2>&1 | grep -E 'ready at|probing|printer answered|printer at|probe of .* failed' || { echo "no probe log lines"; exit 1; }
          docker logs preform 2>&1 | grep -q "printer at $GW: Form 4" || { echo "simulated printer not discovered at start"; cat sim.log; exit 1; }
      - name: The simulated printer received the job
        run: |
          grep -c 'PROTOCOL_METHOD_UPLOAD_LAYER' sim.log
          grep -q 'PROTOCOL_METHOD_START_JOB' sim.log && grep -q 'PROTOCOL_METHOD_UPLOAD_LAYER' sim.log
      - name: printers and doctor subcommands against the running server
        run: |
          docker exec -e PREFORM_PRINTERS_TIMEOUT=3 preform preform-linux printers 198.51.100.1
          docker exec preform preform-linux doctor
      - name: Doctor
        if: always()
        run: docker exec preform preform-linux doctor || true
      - name: Container logs
        if: always()
        run: docker logs preform 2>&1 | tail -n 200
      - name: Clean stop
        run: docker stop -t 20 preform && docker rm preform

  bare-metal-shim:
    name: Bare metal, WineHQ devel + forced dnsapi shim
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PREFORM_SHIM: "1" # exercise the shim path even though this Wine does not need it
      PREFORM_SHIM_TRACE: "1" # and log the mDNS queries PreFormServer makes
    steps:
      - uses: actions/checkout@v5
      - name: Install WineHQ devel, mingw-w64, Xvfb, osslsigncode
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSL https://dl.winehq.org/wine-builds/winehq.key -o /etc/apt/keyrings/winehq-archive.key
          sudo curl -fsSL https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources -o /etc/apt/sources.list.d/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends winehq-devel gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev binutils-mingw-w64-x86-64 make xvfb xauth osslsigncode libgl1-mesa-dri libegl1
          wine --version
      - run: bin/preform-linux doctor || true
      - name: Install PreFormServer (Authenticode-checked) and the shim
        run: bin/preform-linux install
      - run: bin/preform-linux doctor
      - name: Wine sanity check inside the prefix
        run: bin/preform-linux wine cmd /c "echo hello from wine && ver"
      - name: Simulated printer on a loopback alias
        run: |
          sudo ip addr add 198.51.100.21/32 dev lo
          sudo nohup python3 sim/printer-sim.py --bind 198.51.100.21 --serial SimForm4 >sim.log 2>&1 &
          sleep 1; sudo ss -ltnp | grep -q '198.51.100.21:35' || { cat sim.log; exit 1; }
      - name: Run PreFormServer in the background
        env:
          WINEDEBUG: "-all,err+all"
          PREFORM_STARTUP_TIMEOUT: "400"
          PREFORM_PRINTERS: "198.51.100.21"
          PREFORM_PRINTERS_INTERVAL: "0"
        run: |
          nohup bin/preform-linux run >preform.log 2>&1 &
          echo $! >preform.pid
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:44388/ || true)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "up after ${i}x5s (HTTP $code)"; exit 0; fi
            kill -0 "$(cat preform.pid)" 2>/dev/null || { echo "exited"; cat preform.log; exit 1; }
            sleep 5
          done
          echo "timed out"; cat preform.log; exit 1
      - name: Smoke test through the API (prints to the simulated printer too)
        run: SMOKE_SIM_PRINTER=SimForm4 SMOKE_LOCAL_DIR="$HOME/jobs" SMOKE_REMOTE_DIR="Z:$HOME/jobs" examples/smoke.sh
      - name: printers subcommand (the simulated printer, and an address nothing answers on)
        run: |
          PREFORM_PRINTERS_TIMEOUT=10 bin/preform-linux printers 198.51.100.21 | head -c 300; echo
          PREFORM_PRINTERS_TIMEOUT=3 bin/preform-linux printers 198.51.100.1 >/dev/null
          grep -q 'printer at 198.51.100.21: Form 4' preform.log || { echo "not discovered at start"; exit 1; }
      - name: The simulated printer received the job
        run: grep -q 'PROTOCOL_METHOD_START_JOB' sim.log && grep -c 'PROTOCOL_METHOD_UPLOAD_LAYER' sim.log
      - name: mDNS queries PreFormServer asked the shim for
        run: grep -F '[dnsapi-shim]' preform.log | sort | uniq -c || echo "(none logged)"
      - name: Logs
        if: always()
        run: tail -n 200 preform.log
      - name: Stop
        if: always()
        run: kill -TERM "$(cat preform.pid)" 2>/dev/null; sleep 5; wineserver -k 2>/dev/null || true

  publish:
    name: Publish image to GHCR
    # Every green main build pushes :main; a v* tag pushes :<version> and :latest.
    if: github.event_name == 'push'
    needs: [lint, shim, docker, bare-metal-shim]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the CLI version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(bin/preform-linux version)" = "${GITHUB_REF_NAME}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
